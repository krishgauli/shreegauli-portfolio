<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LinkedIn Cover – Shree Gauli</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1584px; height: 396px; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }

  .cover {
    width: 1584px;
    height: 396px;
    background: #0a0a0f;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  /* Gradient orbs */
  .orb1 {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.55) 0%, transparent 70%);
    top: -200px; left: -80px;
    filter: blur(40px);
  }
  .orb2 {
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,0.4) 0%, transparent 70%);
    bottom: -200px; right: 200px;
    filter: blur(50px);
  }
  .orb3 {
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,158,11,0.25) 0%, transparent 70%);
    top: 20px; right: 80px;
    filter: blur(35px);
  }

  /* Grid lines */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Noise overlay */
  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* Left accent line */
  .accent-line {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(to bottom, #7C3AED, #22D3EE, #F59E0B);
  }

  /* Content */
  .content {
    position: relative;
    z-index: 10;
    padding: 0 100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .left { flex: 1; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.35);
    border-radius: 100px;
    padding: 6px 16px;
    margin-bottom: 20px;
  }
  .eyebrow-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #7C3AED;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:0.4; }
  }
  .eyebrow-text {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #A78BFA;
  }

  .name {
    font-size: 62px;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -0.03em;
    color: #ffffff;
    margin-bottom: 12px;
  }
  .name span {
    background: linear-gradient(135deg, #A78BFA 0%, #22D3EE 60%, #F59E0B 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .title {
    font-size: 20px;
    font-weight: 500;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.01em;
  }
  .divider {
    width: 1px; height: 20px;
    background: rgba(255,255,255,0.2);
  }

  .tags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tag {
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .tag-violet { background: rgba(124,58,237,0.2); color: #C4B5FD; border: 1px solid rgba(124,58,237,0.3); }
  .tag-cyan   { background: rgba(34,211,238,0.15); color: #67E8F9; border: 1px solid rgba(34,211,238,0.3); }
  .tag-amber  { background: rgba(245,158,11,0.15); color: #FCD34D; border: 1px solid rgba(245,158,11,0.3); }
  .tag-emerald{ background: rgba(16,185,129,0.15); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.3); }

  /* Right stats */
  .right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
    min-width: 280px;
  }

  .stat-row {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    padding: 14px 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    min-width: 200px;
  }
  .stat-num {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #A78BFA, #22D3EE);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .url {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.05em;
  }
  .url span { color: #22D3EE; }
</style>
</head>
<body>
<div class="cover">
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="orb3"></div>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="accent-line"></div>

  <div class="content">
    <div class="left">
      <div class="eyebrow">
        <div class="eyebrow-dot"></div>
        <span class="eyebrow-text">Build Systems. Drive Growth. Repeat.</span>
      </div>

      <div class="name">Shree Krishna <span>Gauli</span></div>

      <div class="title-row">
        <span class="title">Digital Marketing Consultant</span>
        <div class="divider"></div>
        <span class="title">Product Manager</span>
      </div>

      <div class="tags">
        <span class="tag tag-violet">SEO &amp; AEO</span>
        <span class="tag tag-cyan">Marketing Automation</span>
        <span class="tag tag-amber">Growth Strategy</span>
        <span class="tag tag-emerald">Healthcare Marketing</span>
      </div>
    </div>

    <div class="right">
      <div class="stat-row">
        <span class="stat-num">15+</span>
        <span class="stat-label">Live Projects Delivered</span>
      </div>
      <div class="stat-row">
        <span class="stat-num">3× ROI</span>
        <span class="stat-label">Avg. Client Growth</span>
      </div>
      <div class="url">www.<span>shreegauli</span>.com</div>
    </div>
  </div>
</div>
</body>
</html>
