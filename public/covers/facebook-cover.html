<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Facebook Cover – Shree Gauli</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 851px; height: 315px; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }

  .cover {
    width: 851px;
    height: 315px;
    background: #07070f;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  /* Orbs */
  .orb1 {
    position: absolute;
    width: 450px; height: 450px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.6) 0%, transparent 65%);
    top: -200px; left: -80px;
    filter: blur(50px);
  }
  .orb2 {
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,0.4) 0%, transparent 65%);
    bottom: -180px; right: 50px;
    filter: blur(50px);
  }
  .orb3 {
    position: absolute;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,158,11,0.3) 0%, transparent 70%);
    top: 10px; right: 300px;
    filter: blur(30px);
  }

  /* Grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  /* Left accent bar */
  .accent {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(to bottom, #7C3AED, #22D3EE 60%, #F59E0B);
  }

  /* Diagonal stripe */
  .stripe {
    position: absolute;
    width: 2px;
    top: 0; bottom: 0;
    background: linear-gradient(to bottom, transparent, rgba(124,58,237,0.3) 50%, transparent);
    left: 55%;
    transform: rotate(15deg) scaleY(1.5);
  }

  /* Content */
  .content {
    position: relative;
    z-index: 10;
    padding: 0 60px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .left { flex: 1; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(124,58,237,0.12);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 100px;
    padding: 4px 12px;
    margin-bottom: 14px;
  }
  .eyebrow-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #A78BFA;
  }
  .eyebrow-text {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: #A78BFA;
  }

  .name {
    font-size: 40px;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -0.03em;
    color: #ffffff;
    margin-bottom: 8px;
  }
  .name .g {
    background: linear-gradient(to right, #A78BFA, #22D3EE);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .role {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    margin-bottom: 18px;
  }
  .role strong { color: rgba(255,255,255,0.85); font-weight: 600; }

  .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .c1 { background: rgba(124,58,237,0.2); color: #C4B5FD; border: 1px solid rgba(124,58,237,0.3); }
  .c2 { background: rgba(34,211,238,0.15); color: #67E8F9; border: 1px solid rgba(34,211,238,0.3); }
  .c3 { background: rgba(245,158,11,0.15); color: #FCD34D; border: 1px solid rgba(245,158,11,0.3); }
  .c4 { background: rgba(16,185,129,0.15); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.3); }

  /* Right */
  .right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    min-width: 190px;
  }

  .metric {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 10px 18px;
    text-align: right;
    width: 100%;
    backdrop-filter: blur(10px);
  }
  .metric-num {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #A78BFA, #22D3EE);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 2px;
  }
  .metric-label {
    font-size: 9px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .url {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.06em;
  }
  .url span { color: #22D3EE; }
</style>
</head>
<body>
<div class="cover">
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="orb3"></div>
  <div class="grid"></div>
  <div class="accent"></div>
  <div class="stripe"></div>

  <div class="content">
    <div class="left">
      <div class="eyebrow">
        <div class="eyebrow-dot"></div>
        <span class="eyebrow-text">Build Systems. Drive Growth. Repeat.</span>
      </div>

      <div class="name">Shree <span class="g">Gauli</span></div>

      <div class="role">
        <strong>Digital Marketing Consultant</strong> &amp; <strong>Product Manager</strong>
      </div>

      <div class="chips">
        <span class="chip c1">SEO &amp; AEO</span>
        <span class="chip c2">Automation</span>
        <span class="chip c3">Paid Media</span>
        <span class="chip c4">Healthcare</span>
      </div>
    </div>

    <div class="right">
      <div class="metric">
        <div class="metric-num">15+</div>
        <div class="metric-label">Projects Delivered</div>
      </div>
      <div class="metric">
        <div class="metric-num">3× ROI</div>
        <div class="metric-label">Avg. Client Growth</div>
      </div>
      <div class="url">www.<span>shreegauli</span>.com</div>
    </div>
  </div>
</div>
</body>
</html>
